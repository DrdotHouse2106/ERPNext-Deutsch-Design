[project]
name = "deutsch_design"
description = "Vollständige deutsche Oberfläche und frischeres Design für ERPNext"
authors = [{ name = "Marcel Ulber" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
